<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kerr · Black Hole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060a; --ink:#e9ebf2; --muted:#767c91; --accent:#f0b45a; --accent-dim:#9a7740;
    --glass:rgba(11,13,19,0.52); --hair:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
  #c.drag{cursor:grabbing}

  /* observatory instrument panel */
  #panel{position:fixed;top:26px;left:26px;width:298px;padding:24px 24px 20px;
    background:var(--glass);backdrop-filter:blur(22px) saturate(125%);
    -webkit-backdrop-filter:blur(22px) saturate(125%);
    border:1px solid var(--hair);border-radius:16px;
    box-shadow:0 24px 70px -24px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
    user-select:none}
  .eyebrow{font-size:10px;letter-spacing:0.36em;text-transform:uppercase;color:var(--accent);
    margin:0 0 9px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:50px;line-height:0.86;
    margin:0;letter-spacing:-0.012em}
  h1 em{font-weight:400;font-style:italic;color:var(--muted)}
  .sub{font-size:10.5px;color:var(--muted);margin:11px 0 0;line-height:1.5;letter-spacing:0.01em}
  .rule{height:1px;background:linear-gradient(90deg,var(--hair),transparent);margin:18px 0}

  .ctrl{margin:17px 0}
  .ctrl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .ctrl label{font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)}
  .ctrl .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctrl .val b{color:var(--accent);font-weight:500;font-size:14px;margin-right:1px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,0.15);border-radius:2px}
  input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,0.15);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(240,180,90,0.15),0 0 16px rgba(240,180,90,0.65);transition:box-shadow .15s}
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(240,180,90,0.2),0 0 20px rgba(240,180,90,0.8)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(240,180,90,0.15),0 0 16px rgba(240,180,90,0.65)}

  #readout{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
  .ro{display:flex;flex-direction:column;gap:3px}
  .ro span{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted)}
  .ro b{font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .ro b i{font-style:normal;color:var(--muted);font-size:10px;margin-left:2px}

  #hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase;opacity:0.62}
  #hint b{color:var(--accent-dim);font-weight:500}

  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;
    font-size:14px;color:#ff8c8c;line-height:1.6}
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <section id="panel">
    <p class="eyebrow">Relativistic Ray Tracer</p>
    <h1>Kerr<em>.</em></h1>
    <p class="sub">Rotating black hole &amp; accretion disk · backward null geodesics with Doppler and gravitational shift.</p>
    <div class="rule"></div>

    <div class="ctrl">
      <div class="row"><label>Spin&nbsp; a★</label><span class="val"><b id="spinv">0.900</b></span></div>
      <input id="spin" type="range" min="0" max="0.998" step="0.001" value="0.9">
    </div>
    <div class="ctrl">
      <div class="row"><label>Inclination</label><span class="val"><b id="inclv">72</b>°</span></div>
      <input id="incl" type="range" min="1" max="89" step="1" value="72">
    </div>
    <div class="ctrl">
      <div class="row"><label>Exposure</label><span class="val"><b id="expv">+1.6</b> EV</span></div>
      <input id="exp" type="range" min="-3" max="4" step="0.1" value="1.6">
    </div>
    <div class="ctrl">
      <div class="row"><label>Motion</label><span class="val"><b id="tsv">1.0</b>×</span></div>
      <input id="ts" type="range" min="0" max="5" step="0.1" value="1">
    </div>
    <div class="ctrl">
      <div class="row"><label>Turbulence</label><span class="val"><b id="turbv">0.60</b></span></div>
      <input id="turb" type="range" min="0" max="1.5" step="0.05" value="0.6">
    </div>
    <div class="ctrl">
      <div class="row"><label>Flares</label><span class="val"><b id="flarev">1.0</b>×</span></div>
      <input id="flare" type="range" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="ctrl">
      <div class="row"><label>Jet</label><span class="val"><b id="jetv">1.0</b>×</span></div>
      <input id="jet" type="range" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="ctrl">
      <div class="row"><label>Jet speed&nbsp;Γ</label><span class="val"><b id="jgv">5.0</b></span></div>
      <input id="jg" type="range" min="1.5" max="12" step="0.1" value="5">
    </div>
    <div class="ctrl">
      <div class="row"><label>Jet knots</label><span class="val"><b id="jkv">0.70</b></span></div>
      <input id="jk" type="range" min="0" max="1.5" step="0.05" value="0.7">
    </div>
    <div class="ctrl">
      <div class="row"><label>Sky</label><span class="val"><b id="skyv">1.00</b>×</span></div>
      <input id="sky" type="range" min="0" max="2" step="0.05" value="1.0">
    </div>
    <button id="playpause" style="width:100%;margin-top:6px;padding:9px;background:transparent;
      border:1px solid var(--hair);border-radius:9px;color:var(--accent);font:inherit;font-size:11px;
      letter-spacing:0.2em;text-transform:uppercase;cursor:pointer">Pause</button>

    <div class="rule"></div>
    <div id="readout">
      <div class="ro"><span>Horizon r₊</span><b id="rh">—</b></div>
      <div class="ro"><span>ISCO</span><b id="risco">—</b></div>
      <div class="ro"><span>Photon orbit</span><b id="rph">—</b></div>
      <div class="ro"><span>Samples</span><b id="spp">—</b></div>
    </div>
  </section>

  <p id="hint">Drag to tilt · <b>live simulation</b></p>
  <div id="err"></div>

  <script type="module" src="/src/main.ts"></script>
</body></html>
